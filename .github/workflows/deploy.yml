# Build + deploy to GitHub Pages on merge to main (docs/ARCHITECTURE.md ADR-9).
#
# One-time setup: in the repo, Settings → Pages → "Build and deployment" →
# Source: "GitHub Actions".
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          # Project site is served under /high-assurance-updates (ADR-11).
          NEXT_PUBLIC_BASE_PATH: /high-assurance-updates
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Runners now default the Actions runtime to Node 24, which uses its own
    # bundled CA store and rejects the Pages deployment cert as "self-signed".
    # Fall back to the runner's OS trust store (Node's own recommended fix).
    env:
      NODE_OPTIONS: --use-system-ca
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
